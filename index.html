<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase JSON Explorer</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #58a6ff; padding: 20px; margin: 0; }
        .header { background: #161b22; padding: 15px; border-bottom: 1px solid #30363d; margin: -20px -20px 20px -20px; font-weight: bold; }
        .path-label { color: #8b949e; }
        pre { background: #0d1117; padding: 10px; border-radius: 6px; overflow: auto; line-height: 1.4; color: #c9d1d9; }
        .error { color: #ff7b72; }
    </style>
</head>
<body>

<div class="header">
    <span class="path-label">Database Path:</span> <span id="current-url">/</span>
</div>

<pre id="output">Establishing secure connection...</pre>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBxTDFA39JxFGMzqa0qrVwM8bQNEuqyQ78",
        authDomain: "pisowifi-c2429.firebaseapp.com",
        databaseURL: "https://pisowifi-c2429-default-rtdb.firebaseio.com",
        projectId: "pisowifi-c2429",
        storageBucket: "pisowifi-c2429.firebasestorage.app",
        messagingSenderId: "136802332067",
        appId: "1:136802332067:web:685f0683800e719db4be16"
    };

    // 1. Determine the path
    let rawPath = window.location.pathname.substring(1); // Remove leading slash
    
    // Clean ".json" if present, or set to empty string for root access
    let firebaseNode = rawPath.replace(".json", ""); 
    
    // Update UI
    document.getElementById('current-url').innerText = firebaseNode === "" ? "(root) /" : "/" + firebaseNode;

    // 2. Firebase Connection
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    signInAnonymously(auth)
        .then(() => {
            // If firebaseNode is empty, it targets the root of the DB
            const dataRef = ref(db, firebaseNode);
            return get(dataRef);
        })
        .then((snapshot) => {
            if (snapshot.exists()) {
                document.getElementById('output').innerText = JSON.stringify(snapshot.val(), null, 4);
            } else {
                document.getElementById('output').innerHTML = `<span class="error">// 404: No data found at this path.</span>`;
            }
        })
        .catch((err) => {
            document.getElementById('output').innerHTML = `<span class="error">// Error: ${err.message}</span>`;
        });
</script>

</body>
</html>
