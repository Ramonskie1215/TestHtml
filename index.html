<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase JSON Explorer</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #58a6ff; padding: 20px; margin: 0; }
        .header { background: #161b22; padding: 15px; border-bottom: 1px solid #30363d; margin: -20px -20px 20px -20px; }
        .path-label { color: #8b949e; font-size: 0.9em; }
        #current-path { color: #d29922; font-weight: bold; }
        pre { background: #0d1117; padding: 10px; border-radius: 6px; overflow: auto; line-height: 1.4; color: #c9d1d9; }
        .error { color: #ff7b72; }
        .hint { color: #8b949e; font-size: 0.8em; margin-top: 10px; border-top: 1px solid #30363d; padding-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <span class="path-label">Target Node:</span> <span id="current-path">/</span>
</div>

<pre id="output">Initializing connection...</pre>

<div class="hint">
    Try: <a href="#/boot" style="color: #58a6ff;">#/boot</a> | <a href="#" style="color: #58a6ff;">#/(root)</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBxTDFA39JxFGMzqa0qrVwM8bQNEuqyQ78",
        authDomain: "pisowifi-c2429.firebaseapp.com",
        databaseURL: "https://pisowifi-c2429-default-rtdb.firebaseio.com",
        projectId: "pisowifi-c2429",
        storageBucket: "pisowifi-c2429.firebasestorage.app",
        messagingSenderId: "136802332067",
        appId: "1:136802332067:web:685f0683800e719db4be16"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    async function fetchData() {
        const output = document.getElementById('output');
        const pathDisplay = document.getElementById('current-path');
        
        // 1. Get path from Hash (e.g., "#/boot.json" -> "boot")
        let hash = window.location.hash || "#/";
        let firebaseNode = hash.replace("#/", "").replace(".json", "");
        
        pathDisplay.innerText = firebaseNode === "" ? "/" : "/" + firebaseNode;
        output.innerText = `Requesting ${firebaseNode || "root"}...`;

        try {
            // 2. Auth & Get Data
            await signInAnonymously(auth);
            const dataRef = firebaseNode === "" ? ref(db) : ref(db, firebaseNode);
            const snapshot = await get(dataRef);

            if (snapshot.exists()) {
                output.innerText = JSON.stringify(snapshot.val(), null, 4);
            } else {
                output.innerHTML = `<span class="error">// 404: Node "${firebaseNode}" not found.</span>`;
            }
        } catch (err) {
            output.innerHTML = `<span class="error">// Error: ${err.message}</span>`;
        }
    }

    // Run on load
    fetchData();

    // Re-run if the user changes the URL hash without refreshing
    window.addEventListener('hashchange', fetchData);
</script>

</body>
</html>
