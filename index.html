<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JSON GET</title>
    <style>
        /* Minimalist "Plain Text" Style */
        body { margin: 20px; background: white; color: black; }
        pre { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-family: monospace; 
            font-size: 13px;
        }
    </style>
</head>
<body>

<pre id="output">Loading...</pre>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBxTDFA39JxFGMzqa0qrVwM8bQNEuqyQ78",
        authDomain: "pisowifi-c2429.firebaseapp.com",
        databaseURL: "https://pisowifi-c2429-default-rtdb.firebaseio.com",
        projectId: "pisowifi-c2429",
        storageBucket: "pisowifi-c2429.firebasestorage.app",
        messagingSenderId: "136802332067",
        appId: "1:136802332067:web:685f0683800e719db4be16"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    async function getJsonData() {
        const output = document.getElementById('output');
        
        // Extract path from hash (e.g., #/boot -> boot)
        let hash = window.location.hash || "#/";
        let path = hash.replace("#/", "").replace(".json", "");

        try {
            await signInAnonymously(auth);
            
            // Handle root vs specific node
            const dataRef = (path === "" || path === "/") ? ref(db) : ref(db, path);
            const snapshot = await get(dataRef);

            if (snapshot.exists()) {
                // Output raw stringified JSON
                output.textContent = JSON.stringify(snapshot.val(), null, 4);
            } else {
                output.textContent = "null";
            }
        } catch (e) {
            output.textContent = "Error: " + e.message;
        }
    }

    // Listen for hash changes to allow navigation without refresh
    window.addEventListener('hashchange', getJsonData);
    getJsonData();
</script>

</body>
</html>
